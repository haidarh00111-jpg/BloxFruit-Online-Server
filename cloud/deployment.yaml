apiVersion: apps/v1
kind: Deployment
metadata:
  name: blox-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blox-gateway
  template:
    metadata:
      labels:
        app: blox-gateway
    spec:
      containers:
        - name: blox-gateway
          image: your-registry/blox-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: GATEWAY_PORT
              value: "3000"
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: DB_NAME
              value: "bloxfruit"
---
apiVersion: v1
kind: Service
metadata:
  name: blox-gateway
spec:
  selector:
    app: blox-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
